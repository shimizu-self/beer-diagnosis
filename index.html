    :root {
      --bg: #fff8ed;
      --card: #ffffff;
      --text: #2c1f16;
      --muted: #7a6658;
      --accent: #f59e0b;
      --accent-dark: #b45309;
      --line: #f0d7aa;
      --good: #16a34a;
      --danger: #dc2626;
      --shadow: 0 18px 50px rgba(75, 47, 12, 0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 0%, rgba(245, 158, 11, 0.26), transparent 32%),
        radial-gradient(circle at 90% 15%, rgba(251, 191, 36, 0.22), transparent 30%),
        var(--bg);
    }

    .app {
      width: min(100%, 520px);
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    header {
      padding: 18px 4px 14px;
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.7);
      color: var(--accent-dark);
      font-weight: 700;
      font-size: 12px;
    }

    h1 {
      margin: 14px 0 8px;
      font-size: clamp(28px, 8vw, 40px);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .lead {
      margin: 0 auto;
      color: var(--muted);
      line-height: 1.7;
      font-size: 15px;
    }

    .card {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(240, 215, 170, 0.9);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 20px;
      backdrop-filter: blur(12px);
    }

    .home-grid {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    button {
      border: 0;
      border-radius: 18px;
      padding: 14px 16px;
      background: var(--accent);
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
      box-shadow: 0 10px 24px rgba(245, 158, 11, 0.25);
    }

    button:active { transform: scale(0.98); }
    button.secondary {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--line);
      box-shadow: none;
    }
    button.ghost {
      background: transparent;
      color: var(--accent-dark);
      border: 1px dashed var(--line);
      box-shadow: none;
    }

    .mode-card {
      display: grid;
      gap: 6px;
      padding: 16px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 22px;
      text-align: left;
      color: var(--text);
      box-shadow: none;
    }

    .mode-card strong { font-size: 16px; }
    .mode-card span { color: var(--muted); line-height: 1.5; font-weight: 500; }

    .progress {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .bar {
      height: 8px;
      width: 100%;
      background: #f7ead5;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .bar > div {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #facc15);
      width: 0%;
      transition: width 0.24s ease;
    }

    .question-title {
      font-size: 24px;
      line-height: 1.25;
      letter-spacing: -0.03em;
      margin: 0 0 8px;
    }

    .question-help {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.6;
    }

    .choices {
      display: grid;
      gap: 10px;
    }

    .choice {
      width: 100%;
      text-align: left;
      background: #fff;
      color: var(--text);
      border: 1px solid var(--line);
      box-shadow: none;
      display: grid;
      gap: 3px;
    }

    .choice small {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .results {
      display: grid;
      gap: 14px;
      margin-top: 18px;
    }

    .beer {
      padding: 16px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 24px;
    }

    .rank {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 9px;
      border-radius: 999px;
      background: #fff7ed;
      color: var(--accent-dark);
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .beer h3 {
      margin: 0;
      font-size: 20px;
      letter-spacing: -0.03em;
    }

    .beer.sold-out {
      opacity: 0.68;
      background: #fafafa;
    }

    .beer-image {
      display: block;
      width: 100%;
      max-width: 220px;
      aspect-ratio: 1;
      object-fit: contain;
      margin: 0 auto 12px;
      background: #fff7ed;
      border-radius: 14px;
      border: 1px solid var(--line);
    }

    .beer.sold-out .beer-image {
      filter: grayscale(0.6);
    }

    .sold-out-badge {
      display: inline-flex;
      align-items: center;
      padding: 5px 9px;
      border-radius: 999px;
      background: #e5e7eb;
      color: #374151;
      font-size: 12px;
      font-weight: 900;
      margin-left: 6px;
    }

    .meta {
      margin: 4px 0 10px;
      color: var(--muted);
      font-weight: 700;
      font-size: 13px;
    }

    .copy {
      margin: 0 0 10px;
      font-weight: 900;
      color: var(--accent-dark);
    }

    .reason {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
      font-size: 14px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 12px 0;
    }

    .tag {
      padding: 5px 8px;
      border-radius: 999px;
      background: #fef3c7;
      color: #92400e;
      font-weight: 800;
      font-size: 11px;
    }

    .beer-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .beer-actions button {
      flex: 1;
      padding: 11px 12px;
      font-size: 13px;
    }

    .like.liked {
      background: #fee2e2;
      color: var(--danger);
      border-color: #fecaca;
    }

    .section-title {
      margin: 24px 0 10px;
      font-size: 18px;
    }

    .ranking {
      display: grid;
      gap: 8px;
    }

    .ranking-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255,255,255,0.72);
      font-weight: 800;
    }

    .ranking-row span:last-child {
      color: var(--accent-dark);
      white-space: nowrap;
    }

    .beer-master {
      margin-top: 24px;
      padding-top: 2px;
      border-top: 1px dashed var(--line);
    }

    .beer-list-help {
      font-size: 13px;
      margin-bottom: 10px;
    }

    .beer-list-detail {
      margin: 12px 0 14px;
    }

    .beer-list {
      display: grid;
      gap: 8px;
      max-height: 460px;
      overflow: auto;
      padding-right: 2px;
      -webkit-overflow-scrolling: touch;
    }

    .beer-list-header,
    .beer-list-row {
      display: grid;
      grid-template-columns: 56px minmax(0, 1.7fr) minmax(0, 1.2fr) minmax(0, 1.1fr);
      gap: 8px;
      align-items: center;
    }

    .beer-list-header {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 8px 10px;
      border-radius: 14px;
      background: #fff8ed;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
    }

    .beer-list-row {
      width: 100%;
      padding: 10px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      box-shadow: none;
      text-align: left;
      font-size: 12px;
      font-weight: 800;
    }

    .beer-list-row span,
    .beer-list-header span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .beer-list-row.active {
      border-color: var(--accent);
      background: #fff7ed;
    }

    .beer-list-row.sold-out {
      opacity: 0.55;
      background: #f3f4f6;
    }

    .beer-list-row.sold-out span:nth-child(2)::after {
      content: " 売切";
      color: #6b7280;
      font-size: 10px;
      font-weight: 900;
    }

    .beer-list-row.liked span:first-child::after {
      content: " ❤️";
      font-size: 10px;
    }

    .persona {
      padding: 18px;
      border-radius: 24px;
      background: #fff;
      border: 1px solid var(--line);
    }

    .persona h2 { margin: 0 0 6px; }
    .persona p { color: var(--muted); line-height: 1.7; margin: 0; }

    .footer-actions {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }

    .hidden { display: none !important; }
  </style>
</head>

    function renderQuestion() {
      const quiz = quizzes[state.mode];
      const question = quiz.questions[state.index];
      el.quizMode.textContent = quiz.title;
      el.quizCount.textContent = `${state.index + 1} / ${quiz.questions.length}`;
      el.barFill.style.width = `${(state.index / quiz.questions.length) * 100}%`;
      el.questionTitle.textContent = question.title;
      el.questionHelp.textContent = question.help;
      el.choices.innerHTML = "";

      question.answers.forEach(answer => {
        const button = document.createElement("button");
        button.className = "choice";
        button.innerHTML = `<strong>${answer.label}</strong><small>${answer.hint || ""}</small>`;
        button.addEventListener("click", () => choose(answer));
        el.choices.appendChild(button);
      });

    function choose(answer) {
      trackEvent("quiz_answer", {
        quiz_type: state.mode,
        question_number: state.index + 1,
        answer_label: answer.label
      });

      if (answer.weights) {
        Object.entries(answer.weights).forEach(([key, value]) => {
          state.scores[key] += value;
        });
      }
      if (answer.type) state.typeVotes[answer.type] = (state.typeVotes[answer.type] || 0) + 1;
      if (answer.scene) state.sceneVotes[answer.scene] = (state.sceneVotes[answer.scene] || 0) + 1;
      if (answer.mood) state.moodVotes[answer.mood] = (state.moodVotes[answer.mood] || 0) + 1;

      const quiz = quizzes[state.mode];
      state.index += 1;
      if (state.index >= quiz.questions.length) {
        showResult();
      } else {
        renderQuestion();
      }
    }

    function scoreBeer(beer) {
      const attributes = ["bitterness", "sweetness", "sourness", "aroma", "body", "adventure"];
      let score = 0;
      attributes.forEach(attr => {
        score += beer[attr] * state.scores[attr];
      });
      Object.entries(state.sceneVotes).forEach(([scene, votes]) => {
        if (beer.scene.includes(scene)) score += votes * 8;
      });
      return score;
    }

    function recommendedBeers() {
      const availableBeers = beers.filter(beer => !beer.soldOut);

      if (availableBeers.length === 0) {
        return [];
      }

      const scored = availableBeers
        .map(beer => ({ ...beer, score: scoreBeer(beer) }))
        .sort((a, b) => {
          if (b.score !== a.score) return b.score - a.score;
          if (b.adventure !== a.adventure) return b.adventure - a.adventure;
          return a.name.localeCompare(b.name, "ja");
        });

      const poolSize = Math.min(10, scored.length);
      const pool = scored.slice(0, poolSize);

      const selected = [];

      // 1. 本命：一番スコアが高いビール
      const main = scored[0];
      if (main) {
        selected.push({ ...main, recommendationRole: "本命" });
      }

      // 2. 近いけど違う方向：本命とスタイルが違い、スコアも近いビール
      const differentStyle = pool.find(beer =>
        beer.id !== main?.id &&
        beer.style !== main?.style
      ) || scored.find(beer =>
        beer.id !== main?.id &&
        beer.style !== main?.style
      );

      if (differentStyle) {
        selected.push({ ...differentStyle, recommendationRole: "近いけど違う方向" });
      }

      // 3. 冒険枠：候補プールの中から adventure 高め or 変化球タグ寄りのビール
      const adventurous = pool
        .filter(beer => !selected.some(item => item.id === beer.id))
        .sort((a, b) => {
          const aBonus = adventureBonus(a);
          const bBonus = adventureBonus(b);
          if (bBonus !== aBonus) return bBonus - aBonus;
          if (b.adventure !== a.adventure) return b.adventure - a.adventure;
          return b.score - a.score;
        })[0] || scored.find(beer => !selected.some(item => item.id === beer.id));

      if (adventurous) {
        selected.push({ ...adventurous, recommendationRole: "冒険枠" });
      }

      // 念のため3件未満の場合はスコア順で補完
      scored.forEach(beer => {
        if (selected.length >= 3) return;
        if (!selected.some(item => item.id === beer.id)) {
          selected.push({ ...beer, recommendationRole: "おすすめ" });
        }
      });

      return selected.slice(0, 3);
    }

    function adventureBonus(beer) {
      const tags = Array.isArray(beer.tags) ? beer.tags.join(";") : String(beer.tags || "");
      const scene = Array.isArray(beer.scene) ? beer.scene.join(";") : String(beer.scene || "");
      let bonus = beer.adventure * 3;

      if (/変化球|個性派|甘酸っぱい|フルーティ|ワイン派|高アルコール|ホップ強め|上級者|沼入口|ちょい冒険|ヘイジー|ジューシー/i.test(tags)) {
        bonus += 8;
      }
      if (/Fruit|Sour|Triple|Strong|Farmhouse|NEIPA|Hazy/i.test(beer.style)) {
        bonus += 6;
      }
      if (/party|slow/.test(scene)) {
        bonus += 2;
      }

      return bonus;
    }

    function getDiagnosisLabel() {
      const votedType = topKey(state.typeVotes);
      if (votedType && diagnosisProfiles[votedType]) {
        return diagnosisProfiles[votedType];
      }

      const s = state.scores;
      if (s.bitterness >= 5 && s.aroma >= 4 && s.adventure >= 2) return diagnosisProfiles["ホップジャンキー"];
      if (s.sourness >= 4 && s.sweetness >= 3) return diagnosisProfiles["フルーツ＆酸味探検家"];
      if (s.body >= 5) return diagnosisProfiles["しっぽり濃厚派"];
      if ((state.sceneVotes.food || 0) > 0) return diagnosisProfiles["食中酒ハンター"];
      if (s.adventure >= 5) return diagnosisProfiles["変化球ウェルカム"];
      if (s.adventure <= -3 || s.body <= -4) return diagnosisProfiles["安心スタート派"];
      return diagnosisProfiles["バランス型クラフト入門派"];
    }

    function topKey(obj) {
      return Object.entries(obj).sort((a, b) => b[1] - a[1])[0]?.[0];

    function likeStore() {
      return JSON.parse(localStorage.getItem("beer_likes") || "{}");

    function likedStore() {
      return JSON.parse(localStorage.getItem("beer_liked_by_me") || "[]");

    function likeCount(id) {

    function hasLiked(id) {

    function toggleLike(id) {
      const likes = likeStore();
      const liked = new Set(likedStore());
      if (liked.has(id)) {
        liked.delete(id);
        likes[id] = Math.max(0, (likes[id] || 0) - 1);
      } else {
        liked.add(id);
        likes[id] = (likes[id] || 0) + 1;
      }
      localStorage.setItem("beer_likes", JSON.stringify(likes));
      localStorage.setItem("beer_liked_by_me", JSON.stringify([...liked]));
    }

    function bindLikeButtons() {
      document.querySelectorAll("[data-like]").forEach(button => {
        button.addEventListener("click", () => {
          const beerId = button.dataset.like;
          const beer = beers.find(item => item.id === beerId);
          if (beer?.soldOut) return;
          const willLike = !hasLiked(beerId);

          trackEvent("beer_like_click", {
            action: willLike ? "like" : "unlike",
            quiz_type: state.mode,
            beer_id: beerId,
            beer_name: beer?.name || "",
            beer_brewery: beer?.brewery || "",
            beer_style: beer?.style || ""
          });

          if (willLike) {
            trackEvent("beer_delicious_click", {
              quiz_type: state.mode,
              beer_id: beerId,
              beer_name: beer?.name || "",
              beer_brewery: beer?.brewery || "",
              beer_style: beer?.style || ""
            });

            if (beer) {
              sendLikeToSheet(beer, state.mode);
            }
          }

          toggleLike(beerId);

          // いいね後は結果画面全体を再描画しない。
          // showResult() を呼ぶと beer_card_view が再発火するため、ボタンとランキングだけ更新する。
          button.classList.toggle("liked", hasLiked(beerId));
          const countElement = button.querySelector("span");
          if (countElement) countElement.textContent = likeCount(beerId);

          const rankingElement = el.resultBody.querySelector(".ranking");
          if (rankingElement) rankingElement.innerHTML = likedBeersHtml();

          if (el.homeRanking) {
            el.homeRanking.innerHTML = likedBeersHtml();
          }

          document.querySelectorAll(`[data-open-beer="${beerId}"]`).forEach(row => {
            row.classList.toggle("liked", hasLiked(beerId));
          });
        });
      });
    }

    function likedBeersHtml() {
      const likedIds = likedStore();
      const likedBeers = likedIds
        .map(id => beers.find(beer => beer.id === id))
        .filter(Boolean);

      if (likedBeers.length === 0) {
        return `
          <div class="ranking-row">
            <span>まだありません。飲んでおいしかったビールを押してね</span>
            <span>🍺</span>
          </div>
        `;
      }

      return likedBeers.map((beer, index) => `
        <div class="ranking-row">
          <span>${index + 1}. ${beer.name}</span>
          <span>${beer.style}</span>
        </div>
      `).join("");
    }

    function renderHomeRanking() {
      el.homeRanking.innerHTML = likedBeersHtml();
    }

    function renderAllBeerList(activeBeerId = null) {
      if (!el.allBeerList) return;

      const sortedBeers = [...beers].sort((a, b) => {
        const aNumber = Number(String(a.id).replace("beer_", ""));
        const bNumber = Number(String(b.id).replace("beer_", ""));
        return aNumber - bNumber;
      });

      el.allBeerList.innerHTML = `
        <div class="beer-list-header" aria-hidden="true">
          <span>id</span>
          <span>name</span>
          <span>brewery</span>
          <span>style</span>
        </div>
        ${sortedBeers.map(beer => `
          <button type="button" class="beer-list-row ${hasLiked(beer.id) ? "liked" : ""} ${beer.soldOut ? "sold-out" : ""} ${beer.id === activeBeerId ? "active" : ""}" data-open-beer="${beer.id}">
            <span>${displayBeerId(beer.id)}</span>
            <span>${beer.name}</span>
            <span>${beer.brewery}</span>
            <span>${beer.style}</span>
          </button>
        `).join("")}
      `;

      bindBeerListRows();
    }

    function bindBeerListRows() {
      document.querySelectorAll("[data-open-beer]").forEach(row => {
        row.addEventListener("click", () => showMasterBeerCard(row.dataset.openBeer));
      });
    }

    function showMasterBeerCard(beerId) {
      const beer = beers.find(item => item.id === beerId);
      if (!beer || !el.beerListDetail) return;

      el.beerListDetail.classList.remove("hidden");
      el.beerListDetail.innerHTML = masterBeerCard(beer);
      document.querySelectorAll("[data-open-beer]").forEach(row => {
        row.classList.toggle("active", row.dataset.openBeer === beerId);
      });

      trackEvent("beer_master_card_open", {
        beer_id: beer.id,
        beer_name: beer.name,
        beer_brewery: beer.brewery,
        beer_style: beer.style,
        sold_out: beer.soldOut ? "true" : "false"
      });

      bindLikeButtons();
      el.beerListDetail.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function showHome() {
      el.quiz.classList.add("hidden");
      el.result.classList.add("hidden");
      el.home.classList.remove("hidden");
      renderHomeRanking();
      renderAllBeerList();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    renderHomeRanking();
    renderAllBeerList();
  </script>
</body>
</html>
