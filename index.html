  <style>
    :root {
      --bg: #fff8ed;
      --card: #ffffff;
      --text: #2c1f16;
      --muted: #7a6658;
      --accent: #f59e0b;
      --accent-dark: #b45309;
      --line: #f0d7aa;
      --good: #16a34a;
      --danger: #dc2626;
      --shadow: 0 18px 50px rgba(75, 47, 12, 0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 0%, rgba(245, 158, 11, 0.26), transparent 32%),
        radial-gradient(circle at 90% 15%, rgba(251, 191, 36, 0.22), transparent 30%),
        var(--bg);
    }

    .app {
      width: min(100%, 520px);
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    header {
      padding: 18px 4px 14px;
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.7);
      color: var(--accent-dark);
      font-weight: 700;
      font-size: 12px;
    }

    h1 {
      margin: 14px 0 8px;
      font-size: clamp(28px, 8vw, 40px);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .lead {
      margin: 0 auto;
      color: var(--muted);
      line-height: 1.7;
      font-size: 15px;
    }

    .card {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(240, 215, 170, 0.9);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 20px;
      backdrop-filter: blur(12px);
    }

    .home-grid {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    button {
      border: 0;
      border-radius: 18px;
      padding: 14px 16px;
      background: var(--accent);
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
      box-shadow: 0 10px 24px rgba(245, 158, 11, 0.25);
    }

    button:active { transform: scale(0.98); }
    button.secondary {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--line);
      box-shadow: none;
    }
    button.ghost {
      background: transparent;
      color: var(--accent-dark);
      border: 1px dashed var(--line);
      box-shadow: none;
    }

    .mode-card {
      display: grid;
      gap: 6px;
      padding: 16px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 22px;
      text-align: left;
      color: var(--text);
      box-shadow: none;
    }

    .mode-card strong { font-size: 16px; }
    .mode-card span { color: var(--muted); line-height: 1.5; font-weight: 500; }

    .progress {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .bar {
      height: 8px;
      width: 100%;
      background: #f7ead5;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .bar > div {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #facc15);
      width: 0%;
      transition: width 0.24s ease;
    }

    .question-title {
      font-size: 24px;
      line-height: 1.25;
      letter-spacing: -0.03em;
      margin: 0 0 8px;
    }

    .question-help {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.6;
    }

    .choices {
      display: grid;
      gap: 10px;
    }

    .choice {
      width: 100%;
      text-align: left;
      background: #fff;
      color: var(--text);
      border: 1px solid var(--line);
      box-shadow: none;
      display: grid;
      gap: 3px;
    }

    .choice small {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .results {
      display: grid;
      gap: 14px;
      margin-top: 18px;
    }

    .beer {
      padding: 16px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 24px;
    }

    .rank {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 9px;
      border-radius: 999px;
      background: #fff7ed;
      color: var(--accent-dark);
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .beer h3 {
      margin: 0;
      font-size: 20px;
      letter-spacing: -0.03em;
    }

    .meta {
      margin: 4px 0 10px;
      color: var(--muted);
      font-weight: 700;
      font-size: 13px;
    }

    .copy {
      margin: 0 0 10px;
      font-weight: 900;
      color: var(--accent-dark);
    }

    .reason {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
      font-size: 14px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 12px 0;
    }

    .tag {
      padding: 5px 8px;
      border-radius: 999px;
      background: #fef3c7;
      color: #92400e;
      font-weight: 800;
      font-size: 11px;
    }

    .beer-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .beer-actions button {
      flex: 1;
      padding: 11px 12px;
      font-size: 13px;
    }

    .like.liked {
      background: #fee2e2;
      color: var(--danger);
      border-color: #fecaca;
    }

    .section-title {
      margin: 24px 0 10px;
      font-size: 18px;
    }

    .ranking {
      display: grid;
      gap: 8px;
    }

    .ranking-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255,255,255,0.72);
      font-weight: 800;
    }

    .ranking-row span:last-child {
      color: var(--accent-dark);
      white-space: nowrap;
    }

    .persona {
      padding: 18px;
      border-radius: 24px;
      background: #fff;
      border: 1px solid var(--line);
    }

    .persona h2 { margin: 0 0 6px; }
    .persona p { color: var(--muted); line-height: 1.7; margin: 0; }

    .footer-actions {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }

    .hidden { display: none !important; }
  </style>

  <main class="app">
    <header>
      <div class="eyebrow">🍺 社内クラフトビール懇親会</div>
      <h1>今のあなたに合う一杯、診断します</h1>
      <p class="lead">5問以内でサクッと診断。苦味が苦手でも大丈夫。会話のきっかけになる“推しビール”を見つけよう。</p>
    </header>

    <section id="home" class="card">
      <div class="home-grid">
        <button class="mode-card" data-start="taste">
          <strong>🍻 ビール診断</strong>
          <span>味の好みから、おすすめビールを3件レコメンド</span>
        </button>
        <button class="mode-card" data-start="brewery">
          <strong>🏭 推しブルワリー診断</strong>
          <span>あなたに刺さりそうなブルワリータイプを診断</span>
        </button>
        <button class="mode-card" data-start="scene">
          <strong>🎉 冒険度・シーン診断</strong>
          <span>今日は安定？冒険？懇親会での飲み方を提案</span>
        </button>
      </div>

      <h2 class="section-title">おいしかったビール</h2>
      <div id="homeRanking" class="ranking"></div>
    </section>

    <section id="quiz" class="card hidden">
      <div class="progress">
        <span id="quizMode">診断</span>
        <span id="quizCount">1 / 5</span>
      </div>
      <div class="bar"><div id="barFill"></div></div>
      <h2 id="questionTitle" class="question-title"></h2>
      <p id="questionHelp" class="question-help"></p>
      <div id="choices" class="choices"></div>
    </section>

    <section id="result" class="card hidden">
      <div id="resultBody"></div>
      <div class="footer-actions">
        <button id="restart">もう一回診断する</button>
        <button id="backHome" class="secondary">トップに戻る</button>
      </div>
    </section>
  </main>

                "scene": [
                      "first",
                      "food",
                      "party"
                ],
                "tags": [
                      "バランス",
                      "初心者OK",
                      "ホップ"
                ],
                "description": "ほどよいホップ香と苦味で、クラフトビール初心者にもすすめやすいバランス型。",
                "next": "beer_006"
          }
    ];

    const nextNames = Object.fromEntries(
          beers.map(beer => [beer.id, `${beer.name}（${beer.brewery}）`])
        );

    const quizzes = {
          taste: {
            title: "ビール診断",
            questions: [
              {
                title: "苦いビール、どれくらいいける？",
                help: "IPAやホップの効いたビールに寄せるか、やさしい一杯に寄せるかを決めます。",
                answers: [
                  { label: "苦いのはちょっと苦手", hint: "ホワイトエールやラガー、軽めのエールへ", weights: { bitterness: -4, body: -1, adventure: -1 } },
                  { label: "ほどほどならOK", hint: "ペールエールやセゾンも候補", weights: { bitterness: 1, aroma: 1 } },
                  { label: "むしろ苦いの好き", hint: "IPA、Hazy、ホップ強めへ", weights: { bitterness: 5, aroma: 2, adventure: 1 } }
                ]
              },
              {
                title: "香りはどっちが好き？",
                help: "柑橘・トロピカル・ハーブ・スパイスなど、香りの方向性を見ます。",
                answers: [
                  { label: "華やかでフルーティーが好き", hint: "Hazy IPAやFruit Ale方面", weights: { aroma: 5, sweetness: 2, adventure: 2 } },
                  { label: "自然に香るくらいがいい", hint: "Pale AleやSaison方面", weights: { aroma: 2, bitterness: 1 } },
                  { label: "香りより飲みやすさ重視", hint: "LagerやWhite Ale方面", weights: { aroma: -2, body: -2, adventure: -1 } }
                ]
              },
              {
                title: "甘酸っぱい・果実っぽい味は好き？",
                help: "グレフル、レモン、柑橘、ワインっぽさが好きかどうかに近い質問です。",
                answers: [
                  { label: "好き。ビールっぽくなくてもOK", hint: "Fruit Aleや変化球へ", weights: { sourness: 4, sweetness: 3, aroma: 2, adventure: 3 } },
                  { label: "少しならアリ", hint: "爽やか系・食中酒系へ", weights: { sourness: 1, sweetness: 1, aroma: 1 } },
                  { label: "酸味や甘さは控えめがいい", hint: "IPA、Pale Ale、Stout方面へ", weights: { sourness: -3, sweetness: -2, bitterness: 1, body: 1 } }
                ]
              },
              {
                title: "飲み口は軽め？濃いめ？",
                help: "乾杯向きの軽快さか、黒ビールや濃厚系の飲みごたえかを選びます。",
                answers: [
                  { label: "軽いほうがいい", hint: "最初の一杯・飲み疲れしない系", weights: { body: -4, bitterness: -1, adventure: -1 } },
                  { label: "中くらいが安心", hint: "バランス型", weights: { body: 1, aroma: 1 } },
                  { label: "濃いの歓迎", hint: "Stout、Strong Ale、Triple IPAも候補", weights: { body: 5, sweetness: 1, adventure: 2 } }
                ]
              },
              {
                title: "今日はどれくらい冒険したい？",
                help: "診断精度より、懇親会で盛り上がる一杯を選ぶための最後の質問です。",
                answers: [
                  { label: "安定の一杯がいい", hint: "迷ったらこれ系", weights: { adventure: -3, body: -1 } },
                  { label: "ちょい冒険したい", hint: "沼入口へ", weights: { adventure: 2, aroma: 1 } },
                  { label: "変化球、大歓迎", hint: "会話ネタ優先", weights: { adventure: 5, sourness: 1, aroma: 1 } }
                ]
              }
            ]
          },
          brewery: {
            title: "推しブルワリー診断",
            questions: [
              {
                title: "惹かれる言葉は？",
                help: "味というより、ブルワリーや銘柄の世界観に近い質問です。",
                answers: [
                  { label: "実験・限定・変化球", hint: "毎回違うものを試したい", type: "実験系", weights: { adventure: 5, aroma: 2, sourness: 1 } },
                  { label: "伝統・職人・丁寧", hint: "信頼できる定番が好き", type: "職人系", weights: { adventure: -2, body: 1, bitterness: 1 } },
                  { label: "地域・人・ストーリー", hint: "背景まで楽しみたい", type: "ローカル密着", weights: { adventure: 1, aroma: 1 }, scene: "food" }
                ]
              },
              {
                title: "懇親会で話題にしたいのは？",
                help: "会話のきっかけになりそうな方向性を選んでください。",
                answers: [
                  { label: "名前やラベルの面白さ", hint: "見た目から盛り上がる", type: "実験系", weights: { adventure: 4, aroma: 1 } },
                  { label: "造り方や味の完成度", hint: "職人技に惹かれる", type: "職人系", weights: { body: 1, bitterness: 1, adventure: -1 } },
                  { label: "料理との合わせ方", hint: "食中酒として楽しむ", type: "食中酒特化", weights: { body: -1, sourness: 1, aroma: 1 }, scene: "food" }
                ]
              },
              {
                title: "推し方として近いのは？",
                help: "今日のあなたのブルワリー人格を決めます。",
                answers: [
                  { label: "尖ってるほど好き", hint: "人に語りたくなる", type: "ホップジャンキー系", weights: { bitterness: 4, aroma: 4, adventure: 4 } },
                  { label: "毎回安心して飲みたい", hint: "定番を信頼する", type: "職人系", weights: { adventure: -3, body: -1, bitterness: -1 } },
                  { label: "ごはんと一緒に楽しみたい", hint: "料理も主役", type: "食中酒特化", weights: { body: -1, sourness: 1, aroma: 1 }, scene: "food" }
                ]
              }
            ]
          },
          scene: {
            title: "冒険度・シーン診断",
            questions: [
              {
                title: "今日の一杯、どんな役割にしたい？",
                help: "味がわからなくても、シーンから選べます。",
                answers: [
                  { label: "最初の一杯を外したくない", hint: "安心スタート", scene: "first", mood: "安定志向", weights: { body: -2, adventure: -1 } },
                  { label: "料理と一緒に楽しみたい", hint: "食中酒重視", scene: "food", mood: "食中酒", weights: { body: -1, sourness: 1, aroma: 1 } },
                  { label: "会話が盛り上がるやつ", hint: "ネタになる一杯", scene: "party", mood: "盛り上がりたい", weights: { adventure: 3, aroma: 2 } }
                ]
              },
              {
                title: "飲むペースは？",
                help: "軽快にいくか、じっくり濃いめを味わうかを見ます。",
                answers: [
                  { label: "軽くサクサク", hint: "飲みやすさ優先", weights: { body: -3, adventure: -1 } },
                  { label: "普通に楽しむ", hint: "バランス型", weights: { body: 1 } },
                  { label: "ゆっくり語りたい", hint: "濃いめ・黒ビールも候補", weights: { body: 4, sweetness: 1 }, scene: "slow" }
                ]
              },
              {
                title: "最後に、冒険度は？",
                help: "アキネーター風の決め質問です。",
                answers: [
                  { label: "安定志向", hint: "間違いないやつ", weights: { adventure: -3 } },
                  { label: "ちょい冒険", hint: "新しい扉を開く", weights: { adventure: 2, aroma: 1 } },
                  { label: "変態歓迎", hint: "尖った一杯もOK", weights: { adventure: 5, bitterness: 1, sourness: 1 } }
                ]
              }
            ]
          }
        };

    const breweryProfiles = {
      "実験系": {
        title: "実験系ブルワリー推し",
        body: "あなたは限定醸造や変化球にワクワクするタイプ。味だけでなく、ラベル・名前・ストーリーで場を盛り上げられます。"
      },
      "職人系": {
        title: "職人系ブルワリー推し",
        body: "あなたは派手さより完成度に惹かれるタイプ。丁寧に造られた定番や、何杯でも飲めるバランス型が似合います。"
      },
      "食中酒特化": {
        title: "食中酒特化ブルワリー推し",
        body: "あなたはビール単体より、料理や会話と一緒に楽しむタイプ。ドライで飲み疲れしないビールと相性抜群です。"
      },
      "ローカル密着": {
        title: "ローカル密着ブルワリー推し",
        body: "あなたは造り手や地域のストーリーまで楽しめるタイプ。背景を知るほど一杯がおいしくなります。"
      },
      "ホップジャンキー系": {
        title: "ホップジャンキー系ブルワリー推し",
        body: "あなたは香りと苦味にテンションが上がるタイプ。IPAを飲み比べると、今日の会話の中心になれるかも。"
      }
    };

    const state = {
      mode: null,
      index: 0,
      scores: { bitterness: 0, sweetness: 0, sourness: 0, aroma: 0, body: 0, adventure: 0 },
      typeVotes: {},
      sceneVotes: {},
      moodVotes: {}
    };

    const el = {
      home: document.getElementById("home"),
      quiz: document.getElementById("quiz"),
      result: document.getElementById("result"),
      quizMode: document.getElementById("quizMode"),
      quizCount: document.getElementById("quizCount"),
      barFill: document.getElementById("barFill"),
      questionTitle: document.getElementById("questionTitle"),
      questionHelp: document.getElementById("questionHelp"),
      choices: document.getElementById("choices"),
      resultBody: document.getElementById("resultBody"),
      homeRanking: document.getElementById("homeRanking")
    };

    document.querySelectorAll("[data-start]").forEach(button => {
      button.addEventListener("click", () => startQuiz(button.dataset.start));
    });

    document.getElementById("restart").addEventListener("click", () => startQuiz(state.mode || "taste"));
    document.getElementById("backHome").addEventListener("click", showHome);

    function startQuiz(mode) {
      trackEvent("quiz_start", {
        quiz_type: mode
      });

      state.mode = mode;
      state.index = 0;
      state.scores = { bitterness: 0, sweetness: 0, sourness: 0, aroma: 0, body: 0, adventure: 0 };
      state.typeVotes = {};
      state.sceneVotes = {};
      state.moodVotes = {};
      el.home.classList.add("hidden");
      el.result.classList.add("hidden");
      el.quiz.classList.remove("hidden");
      renderQuestion();
    }

    function renderQuestion() {
      const quiz = quizzes[state.mode];
      const question = quiz.questions[state.index];
      el.quizMode.textContent = quiz.title;
      el.quizCount.textContent = `${state.index + 1} / ${quiz.questions.length}`;
      el.barFill.style.width = `${(state.index / quiz.questions.length) * 100}%`;
      el.questionTitle.textContent = question.title;
      el.questionHelp.textContent = question.help;
      el.choices.innerHTML = "";

      question.answers.forEach(answer => {
        const button = document.createElement("button");
        button.className = "choice";
        button.innerHTML = `<strong>${answer.label}</strong><small>${answer.hint || ""}</small>`;
        button.addEventListener("click", () => choose(answer));
        el.choices.appendChild(button);
      });
    }

    function choose(answer) {
      trackEvent("quiz_answer", {
        quiz_type: state.mode,
        question_number: state.index + 1,
        answer_label: answer.label
      });

      if (answer.weights) {
        Object.entries(answer.weights).forEach(([key, value]) => {
          state.scores[key] += value;
        });
      }
      if (answer.type) state.typeVotes[answer.type] = (state.typeVotes[answer.type] || 0) + 1;
      if (answer.scene) state.sceneVotes[answer.scene] = (state.sceneVotes[answer.scene] || 0) + 1;
      if (answer.mood) state.moodVotes[answer.mood] = (state.moodVotes[answer.mood] || 0) + 1;

      const quiz = quizzes[state.mode];
      state.index += 1;
      if (state.index >= quiz.questions.length) {
        showResult();
      } else {
        renderQuestion();
      }
    }

    function scoreBeer(beer) {
      const attributes = ["bitterness", "sweetness", "sourness", "aroma", "body", "adventure"];
      let score = 0;
      attributes.forEach(attr => {
        score += beer[attr] * state.scores[attr];
      });
      Object.entries(state.sceneVotes).forEach(([scene, votes]) => {
        if (beer.scene.includes(scene)) score += votes * 8;
      });
      return score;
    }

    function recommendedBeers() {
      return beers
        .map(beer => ({ ...beer, score: scoreBeer(beer) }))
        .sort((a, b) => b.score - a.score)
        .slice(0, 3);
    }

    function showResult() {
      trackEvent("quiz_complete", {
        quiz_type: state.mode
      });

      el.quiz.classList.add("hidden");
      el.result.classList.remove("hidden");
      el.barFill.style.width = "100%";

      if (state.mode === "brewery") {
        renderBreweryResult();
        return;
      }

      if (state.mode === "scene") {
        renderSceneResult();
        return;
      }

      renderBeerResults("あなたにおすすめの3杯");
    }

    function renderBeerResults(title, intro = "診断結果をもとに、今日の一杯候補を選びました。気になったものから飲んでみてください。") {
      const items = recommendedBeers();

      items.forEach((beer, index) => {
        trackEvent("beer_card_view", {
          quiz_type: state.mode,
          recommendation_rank: index + 1,
          beer_id: beer.id,
          beer_name: beer.name,
          beer_brewery: beer.brewery,
          beer_style: beer.style
        });
      });

      el.resultBody.innerHTML = `
        <h2 class="question-title">${title}</h2>
        <p class="question-help">${intro}</p>
        <div class="results">
          ${items.map((beer, index) => beerCard(beer, index)).join("")}
        </div>
        <h2 class="section-title">おいしかったビール</h2>
        <div class="ranking">${likedBeersHtml()}</div>
      `;
      bindLikeButtons();
    }

    function beerCard(beer, index) {
      const liked = hasLiked(beer.id) ? "liked" : "";
      return `
        <article class="beer">
          <div class="rank">No.${index + 1} ${index === 0 ? "今日の本命" : index === 1 ? "次点" : "冒険枠"}</div>
          <h3>${beer.name}</h3>
          <div class="meta">${beer.brewery} / ${beer.style}</div>
          <p class="copy">${beer.catch}</p>
          <p class="reason">${beer.description}</p>
          <div class="tags">${beer.tags.map(tag => `<span class="tag">${tag}</span>`).join("")}</div>
          <p class="reason"><strong>次に飲むなら：</strong>${nextNames[beer.next] || "店員さんに近い味を聞いてみよう"}</p>
          <div class="beer-actions">
            <button class="secondary like ${liked}" data-like="${beer.id}">❤️ おいしかった <span>${likeCount(beer.id)}</span></button>
          </div>
        </article>
      `;
    }

    function renderBreweryResult() {
      const type = topKey(state.typeVotes) || "職人系";
      const profile = breweryProfiles[type];
      renderBeerResults(
        profile.title,
        `${profile.body} まずは下の3杯から、近い世界観のものを選んでみてください。`
      );
    }

    function renderSceneResult() {
      const mood = topKey(state.moodVotes) || "ちょい冒険";
      renderBeerResults(
        `今日は「${mood}」タイプ`,
        "味の知識がなくても大丈夫。今日のシーンに合わせて、会話が生まれやすい3杯を選びました。"
      );
    }

    function topKey(obj) {
      return Object.entries(obj).sort((a, b) => b[1] - a[1])[0]?.[0];
    }

    function likeStore() {
      return JSON.parse(localStorage.getItem("beer_likes") || "{}");
    }

    function likedStore() {
      return JSON.parse(localStorage.getItem("beer_liked_by_me") || "[]");
    }

    function likeCount(id) {
      return likeStore()[id] || 0;
    }

    function hasLiked(id) {
      return likedStore().includes(id);
    }

    function toggleLike(id) {
      const likes = likeStore();
      const liked = new Set(likedStore());
      if (liked.has(id)) {
        liked.delete(id);
        likes[id] = Math.max(0, (likes[id] || 0) - 1);
      } else {
        liked.add(id);
        likes[id] = (likes[id] || 0) + 1;
      }
      localStorage.setItem("beer_likes", JSON.stringify(likes));
      localStorage.setItem("beer_liked_by_me", JSON.stringify([...liked]));
    }

    function bindLikeButtons() {
      document.querySelectorAll("[data-like]").forEach(button => {
        button.addEventListener("click", () => {
          const beerId = button.dataset.like;
          const beer = beers.find(item => item.id === beerId);
          const willLike = !hasLiked(beerId);

          trackEvent("beer_like_click", {
            action: willLike ? "like" : "unlike",
            quiz_type: state.mode,
            beer_id: beerId,
            beer_name: beer?.name || "",
            beer_brewery: beer?.brewery || "",
            beer_style: beer?.style || ""
          });

          if (willLike) {
            trackEvent("beer_delicious_click", {
              quiz_type: state.mode,
              beer_id: beerId,
              beer_name: beer?.name || "",
              beer_brewery: beer?.brewery || "",
              beer_style: beer?.style || ""
            });

            if (beer) {
              sendLikeToSheet(beer, state.mode);
            }
          }

          toggleLike(beerId);

          // いいね後は結果画面全体を再描画しない。
          // showResult() を呼ぶと beer_card_view が再発火するため、ボタンとランキングだけ更新する。
          button.classList.toggle("liked", hasLiked(beerId));
          const countElement = button.querySelector("span");
          if (countElement) countElement.textContent = likeCount(beerId);

          const rankingElement = el.resultBody.querySelector(".ranking");
          if (rankingElement) rankingElement.innerHTML = likedBeersHtml();
        });
      });
    }

    function likedBeersHtml() {
      const likedIds = likedStore();
      const likedBeers = likedIds
        .map(id => beers.find(beer => beer.id === id))
        .filter(Boolean);

      if (likedBeers.length === 0) {
        return `
          <div class="ranking-row">
            <span>まだありません。飲んでおいしかったビールを押してね</span>
            <span>🍺</span>
          </div>
        `;
      }

      return likedBeers.map((beer, index) => `
        <div class="ranking-row">
          <span>${index + 1}. ${beer.name}</span>
          <span>${beer.style}</span>
        </div>
      `).join("");
    }

    function renderHomeRanking() {
      el.homeRanking.innerHTML = likedBeersHtml();
    }

    function showHome() {
      el.quiz.classList.add("hidden");
      el.result.classList.add("hidden");
      el.home.classList.remove("hidden");
      renderHomeRanking();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    renderHomeRanking();
  </script>
</body>
</html>
